<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Redefinir Senha - TrackGram</title>
    <style>
      /* Reset & Base */
      body {
        margin: 0;
        padding: 0;
        min-width: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        font-size: 16px;
        line-height: 1.6;
        background-color: #000000; /* Dark Background like Dashboard */
        color: #e5e5e5;
      }

      /* Container */
      .wrapper {
        width: 100%;
        table-layout: fixed;
        background-color: #000000;
        padding: 40px 0;
      }

      .main {
        margin: 0 auto;
        width: 100%;
        max-width: 500px;
        background-color: #0a0a0a; /* Slightly lighter black for card */
        border: 1px solid #262626; /* neutral-800 border */
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(139, 92, 246, 0.1); /* Subtle purple glow */
      }

      /* Header */
      .header {
        padding: 32px 40px;
        text-align: center;
        border-bottom: 1px solid #262626;
      }

      .logo {
        font-size: 24px;
        font-weight: 700;
        color: #ffffff;
        letter-spacing: -0.5px;
        text-decoration: none;
      }
      .logo-accent {
        color: #a78bfa; /* Violet-400 */
      }

      /* Content */
      .content {
        padding: 40px;
      }

      h1 {
        font-size: 22px;
        font-weight: 600;
        margin: 0 0 24px 0;
        color: #ffffff;
        text-align: center;
      }

      p {
        color: #a3a3a3; /* neutral-400 */
        font-size: 15px;
        margin-bottom: 24px;
        text-align: center;
      }

      /* Button */
      .btn-container {
        text-align: center;
        margin: 32px 0;
      }

      .btn {
        background: #7c3aed; /* Violet-600 */
        color: #ffffff !important;
        display: inline-block;
        font-weight: 500;
        text-decoration: none;
        padding: 14px 32px;
        border-radius: 12px;
        font-size: 15px;
        transition: all 0.2s;
        /* Gradient like dashboard */
        background: linear-gradient(to right, #7c3aed, #9333ea);
        box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
      }

      .btn:hover {
        opacity: 0.9;
        transform: translateY(-1px);
      }

      /* Footer */
      .footer {
        padding: 24px;
        text-align: center;
        border-top: 1px solid #262626;
        background-color: #050505;
      }

      .footer p {
        margin: 0;
        font-size: 12px;
        color: #525252;
      }

      /* Link */
      .link-fallback {
        color: #525252;
        font-size: 12px;
        word-break: break-all;
        text-align: center;
        margin-top: 32px;
        line-height: 1.4;
      }
      .link-fallback a {
        color: #6366f1;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <div class="main">
        <!-- Header -->
        <div class="header">
          <div class="logo">Track<span class="logo-accent">Gram</span></div>
        </div>

        <!-- Content -->
        <div class="content">
          <!-- Icon -->
          <div style="text-align: center; margin-bottom: 24px">
            <img
              src="https://cdn-icons-png.flaticon.com/512/6195/6195698.png"
              width="48"
              height="48"
              style="
                opacity: 0.8;
                filter: invert(1) brightness(2) hue-rotate(250deg);
              "
              alt="Lock"
            />
          </div>

          <h1>Recuperar Senha</h1>

          <p>
            Recebemos uma solicitação para redefinir sua senha. Clique no botão
            abaixo para criar uma nova senha segura.
          </p>

          <!-- Button -->
          <div class="btn-container">
            <a href="{{ .ConfirmationURL }}" class="btn"> Redefinir Senha </a>
          </div>

          <p class="link-fallback">
            Se o botão não funcionar, copie este link:<br />
            <span style="color: #737373">{{ .ConfirmationURL }}</span>
          </p>
        </div>

        <!-- Footer -->
        <div class="footer">
          <p>Se você não solicitou isso, ignore este email.</p>
          <p style="margin-top: 8px">&copy; 2025 TrackGram</p>
        </div>
      </div>
    </div>
  </body>
</html>
